<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Budgeting App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">💰 Budgeting App</a>
    </div>
</nav>

<section class="contact-section">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-6">

<div class="contact-box">

<h2 class="text-center mb-4">Contact Us</h2>

<form>

<div class="mb-3">
<label>Name</label>
<input type="text" class="form-control" placeholder="Enter your name">
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" class="form-control" placeholder="Enter your email">
</div>

<div class="mb-3">
<label>Message</label>
<textarea class="form-control" rows="5" placeholder="Write your message"></textarea>
</div>

<button class="btn btn-primary w-100">
Send Message
</button>

</form>

<hr>

<h5>Contact Details</h5>

<p>📧 Email: support@budgetingapp.com</p>

<p>📱 Phone: +91 638784xxxx</p>

<p>📍 India</p>

</div>

</div>

</div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
