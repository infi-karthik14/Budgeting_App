<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Bachat Buddy</title>


    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <!-- CSS -->

    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/css/register.css">

</head>


<body>


    <!-- ==================================================
         REGISTER CARD
    ================================================== -->

    <div class="login-card">


        <!-- HEADER -->

        <div class="text-center mb-4">

            <i class="fa-solid fa-wallet logo"></i>

            <h2 class="mt-3">
                Create Your Account
            </h2>

            <p class="text-muted">
                Start managing your money with Bachat Buddy
            </p>

        </div>



        <!-- ==================================================
             REGISTER FORM
        ================================================== -->

        <form id="registerForm">


            <!-- FULL NAME -->

            <div class="mb-3">

                <label for="fullName" class="form-label">

                    Full Name

                </label>


                <input type="text" id="fullName" class="form-control" placeholder="Enter your full name"
                    autocomplete="name" required>

            </div>

            <!-- PHONE NUMBER -->

            <div class="mb-3">

                <label for="phoneNumber" class="form-label">
                    Phone Number
                </label>

                <input type="tel" id="phoneNumber" class="form-control" placeholder="Enter your phone number"
                    autocomplete="tel" maxlength="10" required>

            </div>



            <!-- EMAIL -->

            <div class="mb-3">

                <label for="email" class="form-label">

                    Email Address

                </label>


                <input type="email" id="email" class="form-control" placeholder="Enter your email" autocomplete="email"
                    required>

            </div>



            <!-- PASSWORD -->

            <div class="mb-3">

                <label for="password" class="form-label">

                    Password

                </label>


                <div class="input-group">

                    <input type="password" id="password" class="form-control" placeholder="Create a password"
                        autocomplete="new-password" required>


                    <button type="button" id="togglePassword" class="input-group-text" aria-label="Show password">

                        <i class="fa-solid fa-eye" id="eyeIcon">
                        </i>

                    </button>

                </div>


                <div class="password-strength mt-2">

                    <div id="passwordStrengthBar" class="password-strength-bar">
                    </div>

                </div>


                <small id="passwordStrengthText" class="text-muted">

                    Use at least 8 characters.

                </small>

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="mb-3">

                <label for="confirmPassword" class="form-label">

                    Confirm Password

                </label>


                <div class="input-group">

                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password"
                        autocomplete="new-password" required>


                    <button type="button" id="toggleConfirmPassword" class="input-group-text"
                        aria-label="Show password">

                        <i class="fa-solid fa-eye" id="confirmEyeIcon">
                        </i>

                    </button>

                </div>

            </div>



            <!-- TERMS -->

            <div class="form-check mb-3">

                <input class="form-check-input" type="checkbox" id="terms" required>


                <label class="form-check-label" for="terms">

                    I agree to the
                    <a href="terms.html">
                        Terms & Conditions
                    </a>

                    and

                    <a href="privacy.html">
                        Privacy Policy
                    </a>

                </label>

            </div>



            <!-- ERROR MESSAGE -->

            <div id="errorMessage" class="text-danger text-center mb-3">

            </div>



            <!-- SUCCESS MESSAGE -->

            <div id="successMessage" class="text-success text-center mb-3">

            </div>



            <!-- REGISTER BUTTON -->

            <button type="submit" id="registerBtn" class="btn btn-primary w-100">

                <i class="fa-solid fa-user-plus me-2"></i>

                Create Account

            </button>


        </form>


        <!-- LOGIN -->

        <hr>

        <p class="text-center mb-0">
            Already have an account?
            <a href="login.html" id="loginLink">
                Login
            </a>
        </p>

    </div>



    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Register JavaScript -->

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/register.js"></script>


</body>

</html>
