<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Budgeting App</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Register CSS -->
    <link rel="stylesheet" href="assets/css/register.css">

</head>

<body>

    <div class="register-card">

        <!-- Header -->

        <div class="text-center mb-4">

            <i class="fa-solid fa-wallet logo"></i>

            <h2 class="mt-3">
                Create Account
            </h2>

            <p>
                Start managing your money today
            </p>

        </div>


        <!-- Register Form -->

        <form id="registerForm">

            <!-- Full Name -->

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>

            </div>


            <!-- Email -->

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>

            </div>


            <!-- Password -->

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <div class="input-group">

                    <input type="password" id="password" class="form-control" placeholder="Create a password" required>

                    <button type="button" class="input-group-text" id="togglePassword">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>


            <!-- Confirm Password -->

            <div class="mb-3">

                <label class="form-label">
                    Confirm Password
                </label>

                <div class="input-group">

                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password"
                        required>

                    <button type="button" class="input-group-text" id="toggleConfirmPassword">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>


            <!-- Terms -->

            <div class="form-check mb-3">

                <input class="form-check-input" type="checkbox" id="terms" required>

                <label class="form-check-label" for="terms">

                    I agree to the
                    <a href="terms.html">Terms & Conditions</a>

                </label>

            </div>


            <!-- Error -->

            <div id="errorMessage" class="text-danger text-center mb-3">
            </div>


            <!-- Register Button -->

            <button type="submit" class="btn btn-primary w-100" id="registerBtn">

                <i class="fa-solid fa-user-plus me-2"></i>

                Create Account

            </button>

        </form>


        <hr>


        <!-- Login Link -->

        <p class="text-center">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript -->

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/register.js"></script>

</body>

</html>
