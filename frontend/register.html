<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Budgeting App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="assets/css/forms.css">
</head>

<body class="bg-light">

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-10">

<div class="card shadow-lg border-0 rounded-4">
<div class="card-body p-0">

    <div class="row g-0">

        <!-- Left Side -->
        <div class="col-md-5 bg-primary text-white d-flex flex-column justify-content-center align-items-center p-5">

            <i class="fa-solid fa-wallet fa-4x mb-4"></i>

            <h2 class="fw-bold">Budgeting App</h2>

            <p class="text-center">
                Manage your income, expenses, budgets and financial goals with AI-powered insights.
            </p>

            <img src="images/Finance image.webp"
                 class="img-fluid mt-3"
                 alt="Finance">

        </div>

        <!-- Right Side -->
        <div class="col-md-7 p-5">

            <div class="text-center mb-4">

                <h2>Create Account</h2>

                <p class="text-muted">
                    Join Budgeting App today
                </p>

            </div>

            <form>

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Enter your full name"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email"
                           class="form-control"
                           placeholder="Enter your email"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel"
                           class="form-control"
                           placeholder="Enter your phone number">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    
                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="fa-solid fa-lock"></i>
                        </span>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Create password"
                            required>

                        <span class="input-group-text" id="togglePassword">
                            <i class="fa-solid fa-eye"></i>
                        </span>

                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="fa-solid fa-lock"></i>
                        </span>

                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control"
                            placeholder="Confirm password"
                            required>

                        <span class="input-group-text" id="toggleConfirmPassword">
                            <i class="fa-solid fa-eye"></i>
                        </span>

                    </div>

                </div>

                <button class="btn btn-primary w-100">
                    Create Account
                </button>

            </form>

            <hr>

            <p class="text-center mb-0">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/register.js"></script>

</body>
</html>
