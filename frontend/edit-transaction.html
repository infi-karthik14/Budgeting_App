<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Transaction - Bachat Buddy</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/edit-transaction.css">
</head>

<body>

    <div class="edit-container">

        <!-- HEADER -->

        <div class="page-header">

            <button type="button" class="back-btn" onclick="goBack()">

                <i class="bi bi-arrow-left"></i>

            </button>

            <div>
                <h1>Edit Transaction</h1>

                <p>
                    Update your transaction details
                </p>
            </div>

        </div>


        <!-- FORM -->

        <div class="form-card">

            <form id="editTransactionForm">

                <!-- TRANSACTION ID -->

                <input type="hidden" id="transactionId">


                <!-- DATE -->

                <div class="form-group">

                    <label for="transactionDate">
                        <i class="bi bi-calendar3"></i>
                        Date
                    </label>

                    <input type="date" id="transactionDate" required>

                </div>


                <!-- TYPE -->

                <div class="form-group">

                    <label for="transactionType">
                        <i class="bi bi-arrow-left-right"></i>
                        Transaction Type
                    </label>

                    <select id="transactionType" required>

                        <option value="">
                            Select Type
                        </option>

                        <option value="income">
                            Income
                        </option>

                        <option value="expense">
                            Expense
                        </option>

                    </select>

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="category">
                        <i class="bi bi-tag"></i>
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Salary">
                            Salary
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Health">
                            Health
                        </option>

                        <option value="Rent">
                            Rent
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- AMOUNT -->

                <div class="form-group">

                    <label for="amount">
                        <i class="bi bi-currency-rupee"></i>
                        Amount
                    </label>

                    <input type="number" id="amount" min="0" step="0.01" placeholder="Enter amount" required>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        <i class="bi bi-card-text"></i>
                        Description
                    </label>

                    <textarea id="description" rows="4" placeholder="Enter description"></textarea>

                </div>


                <!-- PAYMENT METHOD -->

                <div class="form-group">

                    <label for="paymentMethod">
                        <i class="bi bi-credit-card"></i>
                        Payment Method
                    </label>

                    <select id="paymentMethod">

                        <option value="">
                            Select Payment Method
                        </option>

                        <option value="Cash">
                            Cash
                        </option>

                        <option value="UPI">
                            UPI
                        </option>

                        <option value="Debit Card">
                            Debit Card
                        </option>

                        <option value="Credit Card">
                            Credit Card
                        </option>

                        <option value="Bank Transfer">
                            Bank Transfer
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- STATUS -->

                <div class="form-group">

                    <label for="status">
                        <i class="bi bi-check-circle"></i>
                        Status
                    </label>

                    <select id="status">

                        <option value="Completed">
                            Completed
                        </option>

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="Cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>


                <!-- BUTTONS -->

                <div class="button-container">

                    <button type="button" class="cancel-btn" onclick="goBack()">

                        <i class="bi bi-x-lg"></i>

                        Cancel

                    </button>


                    <button type="submit" class="update-btn" id="updateButton">

                        <i class="bi bi-check-lg"></i>

                        Update Transaction

                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="assets/js/edit-transaction.js"></script>

</body>

</html>
