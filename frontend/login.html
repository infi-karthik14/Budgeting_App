<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Bachat Buddy</title>

    <link rel="icon" type="image/jpeg" href="assets/images/favicon.jpg">


    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <!-- Login CSS -->

    <link rel="stylesheet" href="assets/css/login.css">

</head>


<body>


    <!-- ==================================================
         LOGIN CARD
    ================================================== -->

    <div class="login-card">


        <!-- LOGO / HEADER -->

        <div class="text-center mb-4">

            <img src="assets/images/bachat-buddy-logo.jpg" class="auth-logo" alt="Bachat Buddy logo">

            <h2 class="mt-3">
                Welcome Back
            </h2>

            <p class="text-muted">
                Login to your Bachat Buddy account
            </p>

        </div>



        <!-- ==================================================
             LOGIN FORM
        ================================================== -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="mb-3">

                <label for="email" class="form-label">

                    Email Address

                </label>


                <input type="email" id="email" class="form-control" placeholder="Enter your email" autocomplete="email"
                    required>

            </div>



            <!-- PASSWORD -->

            <div class="mb-3">

                <label for="password" class="form-label">

                    Password

                </label>


                <div class="input-group">

                    <input type="password" id="password" class="form-control" placeholder="Enter password"
                        autocomplete="current-password" required>


                    <button type="button" id="togglePassword" class="input-group-text" aria-label="Show password">

                        <i class="fa-solid fa-eye" id="eyeIcon">
                        </i>

                    </button>

                </div>

            </div>



            <!-- ERROR MESSAGE -->

            <div id="errorMessage" class="text-danger text-center mb-3">

            </div>



            <!-- REMEMBER / FORGOT PASSWORD -->

            <div class="d-flex justify-content-between mb-3">


                <div class="form-check">

                    <input class="form-check-input" type="checkbox" id="remember">


                    <label class="form-check-label" for="remember">

                        Remember Me

                    </label>

                </div>


                <a href="./forgot-password.html">

                    Forgot Password?

                </a>

            </div>



            <!-- LOGIN BUTTON -->

            <button type="submit" id="loginBtn" class="btn btn-primary w-100">

                Login

            </button>


        </form>



        <!-- DIVIDER -->

        <hr>



        <!-- REGISTER -->

        <p class="text-center">

            Don't have an account?

            <a href="./register.html">
                Register
            </a>

        </p>


    </div>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Login JavaScript -->

    <script src="assets/js/login.js"></script>


</body>

</html>
