server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /login {
        rewrite ^/login$ /login.html permanent;
    }

    location = /register {
        rewrite ^/register$ /register.html permanent;
    }
}